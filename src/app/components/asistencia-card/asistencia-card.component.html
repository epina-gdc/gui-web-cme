<div class="surface-card p-4 shadow-2 border-round-xl flex align-items-center gap-3">
    <div class="border-circle w-4rem h-4rem flex align-items-center justify-content-center"
        [style]="{'background-color': bg_color, 'color': '#fff'}">
        <i [class]="iconClass"></i>
    </div>
    <div>
        <span class="font-bold block mb-1">{{encabezado}}</span>
        <span class="text-xl font-bold text-900">{{descripcion}}</span>
    </div>
</div>
