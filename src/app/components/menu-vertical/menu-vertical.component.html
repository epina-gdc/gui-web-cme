<div class="border-round-2xl bg-white h-full p-2">
  <p class="titulo-menu-asignacion m-3">Menú</p>

  <p-accordion [value]="activePanelId ?? 0" (valueChange)="onAccordionChange($event)">
    @for (modulo of userData?.modulos; track modulo.idModuloMenu) {
      <p-accordion-panel
        [value]="modulo.idModuloMenu"
        [class.no-icono]="modulo.submodulos.length === 0">

        <p-accordion-header (click)="handleHeaderClick($event, modulo)">
          <div class="flex align-items-center gap-3">
            <i [class]="modulo.icono ?? 'pi pi-tag'" [style]="{ 'font-size': '1.8rem'}"></i>
            <p class="titulo-opcion-menu-asignacion">
              {{ modulo.nombre }}
            </p>
          </div>
        </p-accordion-header>

        <p-accordion-content>
          @if (modulo.submodulos.length > 0) {
            <div class="flex flex-column gap-2">
              @for (sub of modulo.submodulos; track sub.idModuloMenu) {
                <div class="sub-opcion my-2 p-3 border-round-lg cursor-pointer"
                     [routerLink]="['/privado' + sub.ruta]"
                     routerLinkActive="seleccion"
                     [routerLinkActiveOptions]="{ exact: true }">
                  <p class="sub-opcion-menu-asignacion">
                    {{ sub.nombre }}
                  </p>
                </div>
              }
            </div>
          }
        </p-accordion-content>

      </p-accordion-panel>
    } @empty {
      <p>No hay opciones de menú para mostrar.</p>
    }
  </p-accordion>
</div>
