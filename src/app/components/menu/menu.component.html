<div class="flex justify-content-between bg-menu px-4 py-3">
  <div class="flex align-items-center">
    <p class="letras-menu-imss pr-4">IMSS</p>
    <hr class="vertical mx-0 me-3"/>
    <span class="border-circle bg-green cmr-texto">CME</span>
    <p class="menu-nombre-sistema ms-3">Convocatoria para médicos especialistas</p>
  </div>
  <div class="flex align-items-center">
    <p
      class="usuario-menu pr-4 mr-6">{{ userData?.nomNombre }} {{ userData?.nomApellidoPaterno }} {{ userData?.nomApellidoMaterno }}</p>
    <p-speeddial [model]="items" direction="down" [transitionDelay]="80"  class="absolute ajuste-avatar">
      <ng-template pTemplate="button" let-toggleCallback="toggleCallback">
        <p-avatar icon="pi pi-user" (click)="toggleCallback($event)" [style]="{ 'background-color': '#E0FFFF', color: '#5DC1B9', 'border-color': '#5DC1B9',
     'border': '2px solid' }" class="ml-8 my-2 cursor-pointer" size="xlarge" shape="circle"/>
      </ng-template>
      <ng-template pTemplate="item" let-item let-toggleCallback="toggleCallback">
        <div class="flex bg-white justify-content-center align-items-center gap-2 border-round card py-1 px-2 flex-row cursor-pointer hover:bg-gray-300"
          (click)="toggleCallback($event, item)">
          <span [class]="item.icon"></span>
          <span style="font-size: 14px">{{ item.label }}</span>
        </div>
      </ng-template>
    </p-speeddial>
  </div>
</div>
