<div class="bg-azul-claro p-4 rounded-4">

    <div class="bg-white p-4 grid rounded-4 shadow-sm">

        <div class="col-12">
            <div class="md:col-6 col-12">

                <div class="field">
                    <label class="field-label" for="rama">Rama de la especialidad</label>
                    <p-iconField iconPosition="right">
                        <p-inputIcon id="rama" styleClass="pi pi-search" class="" />
                        <input type="text" class=" w-full" pInputText placeholder="Search" id="search" />
                    </p-iconField>
                </div>
            </div>
        </div>



        <div class="col-12">
            <div class="grid">
                <!-- Barra lateral -->
                <div class="col-fixed" style="width:350px">
                    <div
                        class="card-rama p-4 bg-white rounded-4 h-full align-content-between flex-wrap position-relative">
                        <div class="align-self-start">
                            <h3 class="font-bold text-lg text-gray-800 mb-2">Pediatría (4 años)</h3>
                            <p class="text-xl font-semibold text-blue-700 mb-4">50 Especialistas</p>

                        </div>
                        <div class=" align-self-end position-absolute bottom-0 left-0 mb-2 ml-3">

                            <div class="flex gap-4 flex-row align-content-center">
                                <span class="font-medium">Total de médicos:</span>
                                <span>435</span>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- Grid de especialidades -->
                <div class="col-12 md:col">
                    <div class="grid align-items-stretch">

                        @for (esp of especialidades; track esp.id) {

                        <div class="col-12 sm:col-6 lg:col-4 xl:col-2">
                            <div class="card p-4 bg-gris border-0 rounded-4 h-full">
                                <div class="text-sm text-gray-600 line-clamp-2">{{esp.nombre}}
                                    <br><span class="text-xs"></span>
                                </div>
                                <div class="mt-2 text-xl font-bold text-gray-900">{{esp.cantidad}}</div>
                            </div>
                        </div>
                        }


                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
