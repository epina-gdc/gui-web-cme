<p-card [style]="{width: 'width'}" styleClass="styleClass">
    <ng-template pTemplate="header">
        <div class="p-3 border-bottom"><span class="font-semibold text-xl">Configuración de mesas </span></div>
    </ng-template>

    <!-- Formulario -->

    <form [formGroup]="formulario">
        <div class="flex flex-column md:flex-row gap-4">
            <!-- Columna izquierda: Fecha, Mesa, Turno -->
            <div class="flex-grow-1">
                <div class="form-grid grid">
                    <div class="field col-12 md:col-6 lg:col-4">
                        <label for="fieldfecAtencion" class="field-label flex pt-2 justify-content-between">
                            <span>Fecha de atención</span>
                            <span class="text-xs text-black-50 ">Obligatorio</span>
                        </label>
                        <p-datePicker id="fieldfecAtencion" formControlName="fecAtencion" class="flex w-full p-date-ate"
                            [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" placeholder="Ingresa fecha"
                            [readonlyInput]="true" [minDate]="minDate" [maxDate]="maxDate" />
                    </div>

                    <div class="field col-12 md:col-6 lg:col-4">
                        <label for="fieldMesa" class="field-label flex pt-2 justify-content-between">
                            <span>Mesa</span>
                            <span class="text-xs text-black-50 ">Obligatorio</span>
                        </label>
                        <p-select id="fieldMesa" [options]="mesas" formControlName="numMesa" placeholder="Ingresa mesa"
                            (onChange)="onChangeMesa($event)" optionLabel="numeroMesa" class="w-full"></p-select>
                    </div>

                    <div class="field col-12 md:col-6 lg:col-4">
                        <label for="fieldTurno" class="field-label flex pt-2 justify-content-between">
                            <span>Turno</span>
                            <span class="text-xs text-black-50 ">Obligatorio</span></label>
                        <p-select id="fieldTurno" [options]="turnos" formControlName="idTurno"
                            placeholder="Ingresa turno" optionLabel="label" optionValue="value"
                            class="w-full"></p-select>
                    </div>

                    <div class="field col-12 md:col-6 lg:col-4">
                        <label for="medicosPorTurno" class="field-label flex pt-2 justify-content-between">
                            <span>No. médicos por turno</span>
                            <span class="text-xs text-black-50 ">Obligatorio</span></label>

                        <p-inputNumber formControlName="numMedicosCupo" placeholder="Ingresa No. médicos por turno"
                            class="w-full" [showButtons]="false" [min]="1">
                        </p-inputNumber>
                        <p-message severity="error" variant="simple" size="small"
                            *ngIf="formulario.get('numMedicosCupo')?.hasError('maxDependiente') && formulario.get('numMedicosCupo')?.touched">
                            El número de médicos es mayor a la disponibilidad de la mesa (Máximo: {{ formulario.get('numMedicosCupo')?.errors?.['maxDependiente']?.valorMaximo
                            }})</p-message>
                    </div>

                    <div class=" field col-12 md:col-6 lg:col-4">
                        <label for="fieldEspecialidad" class="field-label flex pt-2 justify-content-between">
                            <span>Especialidad</span>
                            <span class="text-xs text-black-50 ">Obligatorio</span></label>
                        <p-select id="fieldEspecialidad" [options]="especialidades" formControlName="idEspecialidad"
                            placeholder="Ingresa especialidades" optionLabel="label" optionValue="value"
                            class="w-full"></p-select>
                    </div>

                    <div class=" field col-12 md:col-4">
                        <div class="flex gap-4 align-content-center h-full btn-form">
                            <p-button label="Limpiar" [outlined]="true" (onClick)="limpiarFormulario()" />
                            <p-button label="Guardar" (onClick)="guardar()" [disabled]="formulario.invalid" />
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </form>
</p-card>
