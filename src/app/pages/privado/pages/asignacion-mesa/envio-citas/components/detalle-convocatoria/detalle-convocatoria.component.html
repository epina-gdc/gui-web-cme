<div class="mt-4">
    <p-card class="empty-border">
        <div class="grid">

            <div class="col-12 grid align-content-center">
                <div class="col-fixed" style="width:45px">
                    <p-avatar class="av" [ngClass]="{'full' : value() == 100}" shape="circle">
                        <span class="dot"></span>
                        <i class="pi pi-check"
                            [style]="{color: 'white' ,'font-size': '2rem', 'font-weight': '600'}"></i>
                    </p-avatar>
                </div>
                <div class="col">
                    <span class="text-3xl font-bold">{{ value() }} % </span>
                    @if(value() == 100){
                    <span class="text-lg">Completado</span>
                    }
                    <p-progressBar [value]="value()" class="pgB">
                        <ng-template pTemplate="content">
                        </ng-template>
                    </p-progressBar>
                </div>
            </div>
            <div class="col-12">
                <div class="grid">
                    <div class="col-12 lg:col-6 p-2">
                        <div class="grid p-2 m-2">
                            <div class="col-fixed ">
                                <p-avatar class="av-card" shape="circle">
                                    <span class="dot"></span>
                                    <i class="cme-citas"
                                        [style]="{color: 'white' ,'font-size': '1.7rem', 'font-weight': '200'}"></i>
                                </p-avatar>
                            </div>
                            <div class="col p-2 text-left">
                                <span class="font-semibold text-3xl">Última fecha de carga</span>
                            </div>
                            <div class="col-fixed grid card-fec-h border-round-2xl " style="width:177px">
                                <div class="col-fixed flex flex-column">
                                    <span class="font-normal text-base">Fecha inicio</span>
                                    <span class="font-semibold text-xl">12/08/2026</span>
                                </div>
                                <div class="col-fixed flex flex-column">
                                    <span class="font-normal text-base"> Hora</span>
                                    <span class="font-semibold text-xl">13:25:43 </span>
                                </div>
                            </div>
                        </div>
                        <div class="grid p2 m-2">
                            <div class="card-t-c border-round-2xl p-3 w-full">

                                <div class="col-12 font-bold text-lg">
                                    <span>Total de citas enviadas</span>
                                </div>
                                <hr class="c-hr">
                                <div class="col-12">
                                    <span class="cant">150</span>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="col-12 lg:col-6 p-2">
                        <div class="grid p-2 m-2">
                            <div class="col-fixed ">
                                <p-avatar class="av-card" shape="circle">
                                    <span class="dot"></span>
                                    <i class="cme-citas"
                                        [style]="{color: 'white' ,'font-size': '1.7rem', 'font-weight': '200'}"></i>
                                </p-avatar>
                            </div>
                            <div class="col p-2 text-left">
                                <span class="font-semibold text-3xl">Última fecha de carga</span>
                            </div>
                            <div class="col-fixed grid card-fec-h border-round-2xl " style="width:177px">
                                <div class="col-fixed flex flex-column">
                                    <span class="font-normal text-base">Fecha inicio</span>
                                    <span class="font-semibold text-xl">12/08/2026</span>
                                </div>
                                <div class="col-fixed flex flex-column">
                                    <span class="font-normal text-base"> Hora</span>
                                    <span class="font-semibold text-xl">13:25:43 </span>
                                </div>
                            </div>
                        </div>
                        <div class="grid p2 m-2">
                            <div class="card-t-c border-round-2xl p-3 w-full">

                                <div class="col-12 font-bold text-lg">
                                    <span>Total de citas enviadas con error</span>
                                </div>
                                <hr class="c-hr">
                                <div class="col-12">
                                    <span class="cant">6</span>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </p-card>
</div>
