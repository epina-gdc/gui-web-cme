<p-confirmDialog [style]="{width: '50vw'}" [baseZIndex]="10000" [closable]="true" styleClass="custom-confirm-dialog">
</p-confirmDialog>
<div class="flex flex-row align-content-start gap-4">
    <app-menu-asistencias></app-menu-asistencias>
    <!--
    <div class="surface-ground max-h-screen p-4 font-family"> 
    -->

    <div class="flex flex-column w-100 border-round-xl">
        <h3 class="titulo-seccion mb-3">Registro de asistencia
            extraordinaria </h3>
        <div class="search-header relative border-round-xl overflow-hidden mb-4 shadow-4">
            <div class="header-bg absolute top-0 left-0 w-full h-full"></div>

            <div class="relative z-2 flex flex-column align-items-center justify-content-center h-full text-white p-5">
                <h1 class="text-6xl text-justify w-full md:w-8 lg:w-6 mb-4">Búsqueda por
                    matrícula/folio</h1>

                <div class="flex flex-row md:flex-row gap-2 w-full md:w-8 lg:w-6">
                    <input pInputText type="text" [(ngModel)]="searchQuery" placeholder="Ingresa matrícula/folio"
                        class="flex-1 border-none p-3" />
                    <button pButton label="Limpiar"
                        class="p-button-outlined bg-white text-teal-600 border-none hover:bg-gray-100 font-bold"
                        (click)="clear()">
                    </button>
                    <button pButton label="Buscar" class="bg-teal-600 border-none hover:bg-teal-700 font-bold"
                        [loading]="loading" (click)="search()">
                    </button>
                </div>
            </div>
        </div>

        <div *ngIf="doctor; else emptyState" class="animate-fade-in">

            <div class="grid mb-4">
                <div class="col-12 md:col-4">
                    <asistencia-card [bg_color]="'#abc8f0'" [icono]="'cme-citados'" [encabezado]="'Turno'"
                        [descripcion]="'-'" />
                </div>
                <div class="col-12 md:col-4">
                    <asistencia-card [bg_color]="'#abc8f0'" [icono]="'pi-clock'" [encabezado]="'Hora de asistencia'"
                        [descripcion]="'-'" />
                </div>
                <div class="col-12 md:col-4">
                    <!-- bg-yellow-200 text-white-alpha-90  -->
                    <asistencia-card [bg_color]="'#ffdf7f'" [icono]="'cme-asignaciones'"
                        [encabezado]="'Día de asistencia'" [descripcion]="'-'" />
                </div>
            </div>

            <div class="surface-card shadow-2 border-round-xl p-4 md:p-5">
                <div class="text-gray-600 font-semibold mb-4 border-bottom-1 border-gray-200 pb-2">
                    Información del médico aspirante
                </div>

                <div class="grid">
                    <div
                        class="col-12 md:col-3 flex align-items-center justify-content-center md:justify-content-start">
                        <img [src]="doctor.fotoUrl" class="border-circle w-20rem h-20rem object-cover shadow-2"
                            style="object-fit: cover;" alt="Foto Doctor">
                    </div>

                    <div class="col-12 md:col-9">
                        <h2 class="text-3xl font-bold m-0 mb-2">{{ doctor.nombre }}</h2>
                        <div class="flex flex-wrap gap-3 text-900 mb-4">
                            <span>Matrícula: <strong>{{ doctor.matricula }}</strong></span>
                            <span>CURP: <strong>{{ doctor.curp }}</strong></span>
                            <span>RFC: <strong>{{ doctor.rfc }}</strong></span>
                        </div>

                        <div class="mb-4">
                            <h4 class="m-0 mb-2 text-700">Especialidades</h4>
                            <div class="flex flex-wrap gap-2">
                                <span *ngFor="let esp of doctor.especialidades"
                                    class="border-1 border-blue-200 text-blue-600 px-3 py-1 border-round-2xl text-sm">
                                    {{ esp }}
                                </span>
                            </div>
                        </div>

                        <div class="grid text-sm">
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Fecha'" [descripcion]="doctor.fecha" [icono]="'cme-citas'"
                                    [ajuste]="'ml-5'" [tamanio]="'text-xl'" />
                            </div>
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Hora'" [descripcion]="doctor.hora" [icono]="'cme-time'" />
                            </div>
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Mesa'" [descripcion]="doctor.mesa"
                                    [icono]="'cme-numero-mesa'" [ajuste]="'ml-5'" [tamanio]="'text-xl'" />
                            </div>
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Turno'" [descripcion]="doctor.turno" [icono]="'cme-time'" />
                            </div>
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Modalidad'" [descripcion]="doctor.modalidad"
                                    [icono]="'cme-modalidad'" [ajuste]="'ml-5'" [tamanio]="'text-xl'" />
                            </div>
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Estatus'" [descripcion]="doctor.estatus"
                                    [icono]="'cme-check'" />
                            </div>
                            <div class="col-6 md:col-3 mb-2">
                                <asistencia-note [titulo]="'Verificación documental'"
                                    [descripcion]="doctor.verificacion" [icono]="'pi-star'" />
                                <!--  -->
                            </div>
                        </div>
                    </div>
                </div>


            </div>
            <div class="flex justify-content-end gap-3 mt-4 pt-3 border-top-1 border-gray-200">
                <button pButton label="Eliminar" class="p-button-outlined p-button-danger px-4"
                    (click)="delete()"></button>
                <button pButton label="Registrar" class="bg-teal-600 border-none hover:bg-teal-700 px-4"
                    (click)="register()"></button>
            </div>
        </div>

        <ng-template #emptyState>
            <div
                class="flex flex-column align-items-center justify-content-center mt-6 pt-4 animate-fade-in opacity-70">
                <div class="text-yellow-200 mb-3 relative" style="font-size: 6rem;">
                    <i class="pi pi-folder-open text-8xl text-yellow-300"></i>
                    <i class="pi pi-search absolute text-4xl text-pink-400" style="bottom: -10px; right: -10px;"></i>
                </div>
                <p class="text-gray-500 text-lg">No hay resultados de búsqueda</p>
            </div>
        </ng-template>

    </div>
</div>
