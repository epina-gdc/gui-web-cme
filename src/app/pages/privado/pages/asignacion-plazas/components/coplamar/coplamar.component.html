<div class="flex flex-column bg-white border-round-lg p-3 w-full">
  <form [formGroup]="filtroForm">
    <div class="flex flex-row">
      <div class="md:col-4 col-12">
        <div class="flex justify-content-between">
          <label class="field-label" for="especialidad">Especialidad</label>
        </div>
        <p-select [options]="especialidadList" formControlName="especialidad" optionLabel="label"
                  placeholder="Selecciona una especialidad" class="w-full"/>
      </div>
      <div class="md:col-4 col-12">
        <div class="flex justify-content-between">
          <label class="field-label" for="ooad">OOAD</label>
        </div>
        <p-select [options]="ooadList" formControlName="ooad" optionLabel="label"
                  placeholder="Selecciona una OOAD" class="w-full"/>
      </div>
      <div class="md:col-4 col-12">
        <div class="flex justify-content-between">
          <label class="field-label" for="unidad">Unidad</label>
        </div>
        <p-select [options]="unidadList" formControlName="unidad" optionLabel="label"
                  placeholder="Selecciona unidad médica" class="w-full"/>
      </div>

    </div>
    <div class="flex flex-row">
      <div class="md:col-4 col-12">
        <div class="flex justify-content-between">
          <label class="field-label" for="plaza">Plaza</label>
        </div>
        <input pInputText class="w-full" type="text" id="plaza"
               placeholder="Ingresa una plaza"
               formControlName="plaza"/>
      </div>


      <div class="md:col-4 col-12 flex align-content-center flex-1 gap-3 pt-4">
        <p-button type="button" variant="outlined" label="Limpiar" />
        <p-button type="button" label="Consultar" (onClick)="consultarPlazas()"   />
      </div>
    </div>
  </form>
</div>
<div class="flex my-3">
  <p class="titulo-seccion-asignacion">Plazas disponibles</p>
</div>
@if(plazasList().length > 0){
  <div class="flex flex-column bg-white border-round-lg p-3 w-full">
    @for ( registro of plazasList(); track registro.id) {
      <app-plaza-disponible-card [plaza]="registro"
                                 (abrirDetalleEvent)="show($event)"
      ></app-plaza-disponible-card>
    }
  </div>
}
