<div class="flex flex-column border-round-bottom-xl overflow-hidden shadow-2 surface-card contenedor-footer">

  <div class="flex align-items-center p-4 absolute footer-medico w-full">
    <div class="flex-shrink-0 mr-4">
      <img [alt]="nombreFoto" [title]="nombreFoto" [src]="defaultFile"
           class="border-circle"
           style="width: 60px; height: 60px; object-fit: cover;">
    </div>

    <div class="flex-grow-1">
      <div class="grid p-nogutter">
        <div class="col-12 md:col-6">
          <p class="titulo_footer mb-0">Nombre del médico aspirante</p>
          <p class="dato_footer mt-1 mb-0">
            {{ sesion?.nomNombre | titlecase }} {{ sesion?.nomApellidoPaterno | titlecase }}  {{ sesion?.nomApellidoMaterno | titlecase }}
          </p>
        </div>

        @if (sesion?.cveMatricula) {
          <div class="col-12 mb-3 flex flex-column justify-content-start md:col-6">
            <p class="titulo_footer mb-0 me-3">Matrícula</p>
            <p class="dato_footer mt-1 mb-0"> {{ sesion?.cveMatricula }}</p>
          </div>
        }
        @if (sesion?.refFolio) {
          <div class="col-12 mb-3 flex flex-column justify-content-start md:col-6">
            <p class="titulo_footer mb-0 me-3">Folio</p>
            <p class="dato_footer mt-1 mb-0"> {{ sesion?.refFolio }}</p>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="w-full bg-bottom">
  </div>
</div>
