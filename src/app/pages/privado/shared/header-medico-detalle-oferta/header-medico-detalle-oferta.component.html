<div class="flex bg-blue-oferta-laboral justify-content-between align-items-center  py-3 px-2">
  <div class="flex gap-2">
    <div class="border-left-1 vertical-border mx-3"></div>
    <div class="flex flex-column gap-1">
      <p class="detalle-oferta-laboral-titulo">{{ oferta()?.titulo | titlecase }}</p>
      <p class="detalle-oferta-laboral-sub-titulo">{{ oferta()?.subTitulo | titlecase }}</p>
    </div>
    @if (oferta()?.badgeValue) {
      <div class="flex align-items-center ml-2">
        <p-badge [value]="'• ' + 'Nuevo hospital'" severity="warn" styleClass="badge"/>
      </div>
    }
  </div>
  <div (click)="closeDialog()">
    <p-button icon="pi pi-times" class="icon-white" [rounded]="true" [text]="true"/>
  </div>
</div>
