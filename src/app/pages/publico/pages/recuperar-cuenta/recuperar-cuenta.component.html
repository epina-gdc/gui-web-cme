<div class="flex justify-content-center px-3">
  <h2 class="login-card-titulo">Recuperar contraseña</h2>
</div>
<div class="px-0">
  <hr class=" border-1 text-gray-100">
</div>
<form [formGroup]="formRecuperarCuenta" (ngSubmit)="recuperarContrasenia()">
  <div class=" mt-4">
    <div class="field">
      <label for="curp_recuperar_cuenta" class="field-label">CURP</label>
      <input
        pInputText
        alphanumericOnly
        class="w-full"
        type="text"
        id="curp_recuperar_cuenta"
        oninput="this.value = this.value.toUpperCase()"
        placeholder="Ingresa tu CURP"
        minlength="10"
        maxlength="10"
        formControlName="curp"/>
    </div>
    <div class="form-icon">
      <label class="field-label" for="correoPersonal_recuperar_cuenta">Correo personal</label>
      <input
        pInputText
        emailAllowCaracters
        class="w-full"
        type="text"
        id="correoPersonal_recuperar_cuenta"
        oninput="this.value = this.value.toLowerCase()"
        placeholder="Ingresa correo personal"
        formControlName="correoPersonal"/>
    </div>
  </div>
</form>
<div class="flex justify-content-end mt-3">
  <p-button type="submit" disabled label="Enviar"/>
</div>
